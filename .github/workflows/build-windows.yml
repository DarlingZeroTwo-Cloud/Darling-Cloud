name: Build Windows
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install VS 2019 Build Tools
        run: |
          choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive" --no-progress --limit-output
        continue-on-error: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Run and Screenshot
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exePath = "$releaseDir/darling_cloud.exe"
          Start-Process -FilePath $exePath -WorkingDirectory $releaseDir
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("screenshot.png")
          Write-Host "Screenshot saved"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: darling-screenshot
          path: screenshot.png

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: darling-cloud-windows
          path: build/windows/x64/runner/Release/
